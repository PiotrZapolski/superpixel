<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superpixel</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>

<header class="topbar">
  <div class="input-row">
    <input id="domain-input" type="text" placeholder="example.com" autocomplete="off" spellcheck="false" aria-label="Domain to scan">
    <button id="scan-btn" type="button">Scan</button>
    <button id="current-tab-btn" type="button">Current tab</button>
    <button id="stop-btn" type="button" hidden>Stop</button>
    <button id="settings-btn" type="button" class="icon-btn" title="Settings" aria-label="Open settings">&#9881;</button>
  </div>
  <p id="phase-text" class="phase-text" aria-live="polite"></p>
  <p id="error-text" class="error-text" role="alert" hidden></p>
</header>

<div id="settings-backdrop" class="settings-backdrop" hidden></div>

<aside id="settings-drawer" class="settings-drawer" hidden aria-label="Settings">
  <div class="drawer-header">
    <h2>Settings</h2>
    <button id="settings-close-btn" type="button" class="icon-btn" aria-label="Close settings">&#10005;</button>
  </div>

  <fieldset class="settings-group">
    <legend>Platforms</legend>
    <label class="check-row"><input type="checkbox" id="setting-platform-google"> Google</label>
    <label class="check-row"><input type="checkbox" id="setting-platform-meta"> Meta</label>
    <label class="check-row"><input type="checkbox" id="setting-platform-tiktok"> TikTok</label>
    <label class="check-row"><input type="checkbox" id="setting-platform-linkedin"> LinkedIn</label>
    <label class="check-row"><input type="checkbox" id="setting-platform-bing"> Bing</label>
    <label class="check-row"><input type="checkbox" id="setting-platform-snap"> Snap</label>
  </fieldset>

  <fieldset class="settings-group">
    <legend>Limits</legend>
    <label class="field-row">Google max pages
      <input type="number" min="1" id="setting-maxPagesGoogle">
    </label>
    <label class="field-row">Meta scrolls
      <input type="number" min="0" id="setting-metaScrolls">
    </label>
    <label class="field-row">Meta expand pages
      <input type="number" min="0" id="setting-metaExpandPages">
    </label>
    <label class="field-row">TikTok details
      <input type="number" min="0" id="setting-tiktokDetails">
    </label>
    <label class="field-row">LinkedIn details
      <input type="number" min="0" id="setting-linkedinDetails">
    </label>
    <label class="field-row">LinkedIn pages
      <input type="number" min="1" id="setting-linkedinPages">
    </label>
    <label class="field-row">Bing advertisers
      <input type="number" min="1" id="setting-bingAdvertisers">
    </label>
    <label class="field-row">Cache hours
      <input type="number" min="0" id="setting-cacheHours">
    </label>
  </fieldset>

  <fieldset class="settings-group">
    <legend>TikTok regions</legend>
    <div id="tiktok-regions" class="region-grid"></div>
  </fieldset>

  <fieldset class="settings-group">
    <legend>SearchAPI fallback</legend>
    <label class="field-row">SearchAPI key
      <input type="password" id="setting-searchapiKey" autocomplete="off">
    </label>
    <label class="check-row"><input type="checkbox" id="setting-useSearchapiFallback"> Use as fallback</label>
  </fieldset>

  <fieldset class="settings-group">
    <legend>Debug</legend>
    <label class="check-row"><input type="checkbox" id="setting-showScanTabs"> Show scan tabs</label>
  </fieldset>

  <div class="drawer-actions">
    <button id="settings-save-btn" type="button">Save settings</button>
    <button id="clear-cache-btn" type="button" class="secondary">Clear cache</button>
  </div>
  <p id="settings-status" class="settings-status" aria-live="polite"></p>
</aside>

<main>
  <section id="tags-section" class="panel">
    <h2>On-site tags</h2>
    <div id="tags-groups"></div>
    <div id="brand-signals" class="brand-signals"></div>
  </section>

  <section id="platforms-section" class="panel">
    <div class="section-header-row">
      <h2>Ad libraries</h2>
      <label class="toggle-label">
        <input id="only-confirmed-toggle" type="checkbox">
        Only confirmed
      </label>
    </div>
    <div id="platform-cards"></div>
    <div id="more-libraries" class="more-libraries"></div>
  </section>
</main>

<footer class="footer">
  <div class="footer-row">
    <button id="export-json-btn" type="button" disabled>Export JSON</button>
    <button id="export-csv-btn" type="button" disabled>Export CSV</button>
  </div>
  <div class="footer-row footer-meta">
    <span id="last-scan-note" class="last-scan-note"></span>
    <button id="rescan-btn" type="button" class="secondary" hidden>Rescan</button>
  </div>
</footer>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
