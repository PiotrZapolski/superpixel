name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.SUPERPIXEL_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SUPERPIXEL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        # The command text is ignored: the key has a forced command on the server.
        run: ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes root@65.108.140.190 deploy

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 https://superpixel.run/healthz
