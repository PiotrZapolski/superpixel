name: Full tests

# Pelny zestaw. Wolany z ci.yml (PR) i przez kolejke merge (ref = sha albo galaz).
on:
  workflow_call:
    inputs:
      ref:
        description: 'Sha albo galaz do przetestowania (puste = domyslny ref zdarzenia).'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Sha albo galaz do przetestowania (puste = domyslny ref).'
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done

      - name: Unit tests
        run: node --test 'tests/*.test.js'

      - name: No dash glyphs
        run: |
          if grep -rnP --exclude-dir=.git '[\x{2013}\x{2014}]' --include='*.js' --include='*.md' --include='*.html' --include='*.css' --include='*.json' .; then
            echo "Found an em dash or en dash character. Replace it with a hyphen."
            exit 1
          fi

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Server unit tests
        run: python -m unittest discover -s server -p 'test_*.py' -v
