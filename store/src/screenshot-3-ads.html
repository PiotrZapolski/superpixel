<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Superpixel store screenshot 3</title>
<link rel="stylesheet" href="shots.css">
<style>
  .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  h1 { font-size: 60px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; }
  .legend span { font: 600 15px "Inter", sans-serif; padding: 6px 12px; border-radius: 999px; }
  .l-ok { background: #dcfce7; color: #166534; }
  .l-adv { background: #e0e7ff; color: #3730a3; }

</head>
<body>
<div class="canvas">
  <div class="copy">
    <div class="brand-row"><img src="../../icons/icon128.png" alt="">Superpixel</div>
    <h1>Live ads from <span class="grad">6 public ad libraries</span></h1>
    <p class="lede">Google, Meta, TikTok, LinkedIn, Microsoft (Bing) and Snapchat, searched right from your browser.</p>
    <ul class="points">
      <li><span>Every ad says how sure the match is:</span></li>

    <div class="legend">
      <span class="l-ok">Links to domain</span>
      <span class="l-adv">Same advertiser</span>
      <span class="l-kw">Mentions</span>
      <span class="l-name">Name match</span>

  </div>

  <div class="sidepanel" style="left:746px; top:22px; width:416px; height:800px;">
    <div class="sidepanel-head"><img src="../../icons/icon32.png" alt=""><span class="sp">Superpixel</span><span class="x">&#10005;</span></div>
    <div class="sidepanel-body">
      <iframe src="../../sidepanel/sidepanel.html?shot=ads" style="width:400px; height:731px; transform:scale(1.04);"></iframe>
    </div>
  </div>
</div>
